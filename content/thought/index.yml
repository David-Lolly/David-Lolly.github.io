  - date: "2026/04/03"
    tag: "多邻国员工手册"
    note: "进步是螺旋式的，不一定是比昨天更好，但一定是比之前更好。"
    content: 当然，我们也是人，难免会犯错。当错误发生时，我们不会追究责任，而是深入分析，找出问题所在。这就是我们如何持续提升标准的方法。不是追求完美，而是每天变得比昨天更好一点点。

  - date: "2026/04/04"
    tag: "多邻国员工手册"
    note: "找到自己产品营销的风格"
    content: 起初，我们试图迎合尽可能广泛的受众，但结果却是毫无特色。在营销中，没有什么比平淡无奇更糟糕。因此，我们调整了方向，让我们的营销风格变得古怪、出人意料且常常充满幽默。

  - date: "2026/04/05"
    tag: "毛选"
    note: "如何判断我们有没有和敌人划清界限了？"
    content: 我认为，对我们来说，一个人，一个党，一个军队，或者一个学校，如若不被敌人反对，那就不好了，那一定是同敌人同流合污了。如若被敌人反对，那就好了，那就证明我们同敌人划清界限了。如若敌人起劲的反对我们，把我们说的一塌糊涂、一无是处，那就更好了，那就证明了我们不但同敌人划清了界限而且证明我们的工作是很有成绩的了。

  - date: "2026/04/17"
    tag: "人月聊IT"
    note: "不能把事情讲清楚的根本原因"
    content: 你不能用最简单、最形象化的东西把核心的思路呈现处理，很多时候并不是表达能力差，而是因为你没有把这件事情的逻辑思考清楚。

  - date: "2026/04/18"
    tag: "人月聊IT"   
    note: "知识的深度来自于广度，但也不仅仅只能发展广度，二者要动态配合"
    content: 我原来讲知识广度和深度时，用过一个沙滩的比喻。沙滩的底面积代表知识的广度，高度代表知识深度。广度不够，高度就起不来；只有广度没有深度，知识又会变成一盘散沙。真正有效的成长，一定是广度和深度的动态配合，而不是只押注一边。

  - date: "2026/04/19"
    tag: "思考" 
    note: ""
    content: 当一个东西非常难用，需要花很大的功夫去练的时候，这个东西是不是应该被时代淘汰掉，或者应该被发明出更好的方式来更加颠覆性的解决这个问题，让它变得更加的便捷，这就是机会所在的地方。

  - date: "2026/04/20"
    tag: "人月聊IT" 
    note: "从全局、整体的角度来理解一个新的领域，不要过早的被困于细节中去"
    content: 不求甚解的核心就是不要一开始就钻入到细枝末节中去了，刚开始的重点一定是搞清楚新的领域究竟是个啥，怎样用最通俗的方式对新领域有个完整的理解。

  - date: "2026/04/21"
    tag: "思考" 
    note: "难道只有失去，才能让我们知道什么是真正珍贵的东西吗？"
    content: 平时的清净和无所事事真的是一件值得为之庆幸的事情，没有琐事打扰，自己可以做任何想做的事情，这种幸福只有失去后才会渐渐明白。

  - date: "2026/08/03"
    tag: "思考的熊兄" 
    note: "帮助值得的人争取他的利益"
    content: 当你面对一个还不错的老板、下属或者同事的时候，尽可能的在一些不经意的地方帮助提携他，永远不要认为你的老板、同事是sb，你的下属只是你的工具，你要做的是帮助别人争取他的利益，给予你觉得值得的人想要的东西，特别是在管理下属的时候，少一些对于中继，也就是公司层面的说教和公事公办，多一些人性的关怀和利益倾斜































